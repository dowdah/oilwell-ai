services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30", "-c", "work_mem=4MB"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  api:
    image: oilwell-ai-api:latest
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ${ENV_FILE:-../.env}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    # Missing artifacts leave inference unavailable; this mount is read-only.
    volumes:
      - ../ml/artifacts/current:/models/current:ro
      - ../ml/artifacts/tcn-shadow:/models/shadow:ro
    mem_limit: 512m

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    networks:
      default:
        aliases:
          - ${APP_DOMAIN}
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/passwords:/mosquitto/config/passwords:ro
      - ./certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
    mem_limit: 128m

  web:
    image: oilwell-ai-web:latest
    build: ../apps/web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:80"
    mem_limit: 128m

volumes:
  postgres-data:
  mosquitto-data:

networks:
  default: {}
