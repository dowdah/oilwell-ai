server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vue owns routes such as /diagnostics after the initial document load.
    # Preserve real static-asset 404 responses while serving the SPA shell for
    # client-side routes behind both the loopback and HTTPS proxies.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
